<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Claim files — Localshare</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink:#0a0c11;
      --panel: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.08);
      --line-soft: rgba(255,255,255,0.05);
      --text:#eef0f6;
      --text-dim:#8b93a7;
      --text-faint:#565d70;
      --cobalt:#4f6bff;
      --teal:#19c9ae;
      --brass:#d9ab53;
      --danger:#ff6178;
      --display:'Outfit', sans-serif;
      --font:'Inter', sans-serif;
      --mono:'JetBrains Mono', monospace;
    }

    body {
      background: var(--ink);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
    }

    #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5; }

    .aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .ab { position: absolute; border-radius: 50%; filter: blur(120px); }
    .ab1 { width: 60vw; height: 55vh; background: radial-gradient(ellipse, rgba(79,107,255,0.14) 0%, transparent 70%); top: -18%; right: -10%; }
    .ab2 { width: 50vw; height: 50vh; background: radial-gradient(ellipse, rgba(25,201,174,0.11) 0%, transparent 70%); bottom: -15%; left: -8%; }

    .grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5;
      background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 26px 26px;
      -webkit-mask-image: radial-gradient(ellipse 80% 55% at 50% 15%, #000 40%, transparent 85%);
              mask-image: radial-gradient(ellipse 80% 55% at 50% 15%, #000 40%, transparent 85%);
    }

    /* NAV */
    .topnav {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid var(--line-soft);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .brand-name { font-family: var(--mono); font-weight: 600; font-size: 0.98rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .brand-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--cobalt), var(--teal)); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; font-size: 0.78rem; color: #0a0c11; }

    .btn-share {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 18px; border-radius: 50px;
      font-family: var(--font); font-size: 0.83rem; font-weight: 600;
      text-decoration: none; border: 1px solid var(--line); cursor: pointer;
      background: rgba(255,255,255,0.03);
      color: var(--text); transition: all 0.18s;
    }
    .btn-share:hover { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); }

    /* CONTENT */
    .wrap { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 0 24px 60px; }

    /* TRUST BANNER */
    .ty-banner {
      background: rgba(25,201,174,0.05);
      border: 1px solid rgba(25,201,174,0.2); border-radius: 16px;
      padding: 20px 24px; text-align: center; margin: 32px 0 20px;
      animation: fadeUp 0.5s ease both;
    }
    .ty-icon { font-size: 1.7rem; margin-bottom: 8px; }
    .ty-head { font-family: var(--display); font-size: 1rem; font-weight: 700; color: var(--teal); margin-bottom: 5px; }
    .ty-sub  { font-size: 0.81rem; color: var(--text-dim); line-height: 1.65; }
    .ty-pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
    .ty-pill { background: rgba(25,201,174,0.08); border: 1px solid rgba(25,201,174,0.2); border-radius: 50px; padding: 5px 13px; font-size: 0.72rem; color: var(--teal); font-weight: 600; }

    /* STATES */
    .state { text-align: center; padding: 80px 24px; animation: fadeUp 0.5s ease both; }
    .state-icon { font-size: 2.6rem; margin-bottom: 16px; opacity: 0.9; }
    .state h2 { font-family: var(--display); font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
    .state p { font-family: var(--mono); font-size: 0.78rem; color: var(--text-dim); margin-bottom: 24px; }

    .spinner {
      width: 38px; height: 38px; border: 3px solid var(--line); border-top-color: var(--cobalt);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

    /* CODE HEADER — ticket-stub styling to match homepage */
    .code-header {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; margin-bottom: 18px; overflow: hidden;
      display: flex; align-items: stretch;
      animation: fadeUp 0.5s ease both;
    }
    .code-meta { flex: 1; padding: 18px 20px; }
    .code-meta h3 { font-family: var(--mono); font-size: 0.68rem; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
    .code-val { font-family: var(--mono); font-size: 1.7rem; font-weight: 700; letter-spacing: 0.2em; color: var(--text); }
    .expiry { flex-shrink:0; width: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-left: 1.5px dashed rgba(255,255,255,0.16); background: rgba(217,171,83,0.05); }
    .expiry span:first-child { font-family: var(--mono); font-size: 0.64rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }
    .expiry span:last-child  { font-family: var(--mono); font-size: 0.78rem; color: var(--teal); font-weight: 600; }

    .file-count { font-family: var(--mono); font-size: 0.74rem; color: var(--text-dim); margin-bottom: 12px; padding: 0 2px; animation: fadeUp 0.5s 0.1s ease both; }

    /* FILE CARDS */
    .files-grid { display: flex; flex-direction: column; gap: 9px; animation: fadeUp 0.5s 0.15s ease both; }
    .file-card {
      background: var(--panel); border: 1px solid var(--line-soft);
      border-radius: 13px; padding: 15px 18px; display: flex; align-items: center; gap: 14px;
      transition: all 0.18s;
    }
    .file-card:hover { border-color: rgba(25,201,174,0.3); background: rgba(25,201,174,0.03); }
    .fc-icon { width: 42px; height: 42px; flex-shrink: 0; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 19px; }
    .fc-info { flex: 1; overflow: hidden; }
    .fc-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
    .fc-meta { font-family: var(--mono); font-size: 0.7rem; color: var(--text-faint); }

    .dl-btn {
      background: var(--teal); border: none; border-radius: 9px;
      padding: 10px 20px; font-family: var(--font); font-size: 0.81rem; font-weight: 700;
      color: #06201c; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.18s; white-space: nowrap; flex-shrink: 0;
    }
    .dl-btn:hover { opacity: 0.88; }
    .dl-btn.downloading { opacity: 0.6; cursor: wait; }

    .dl-all-wrap { margin-top: 16px; animation: fadeUp 0.5s 0.2s ease both; }
    .dl-all-btn {
      width: 100%; background: transparent; border: 1px solid var(--line);
      border-radius: 11px; padding: 13px; font-family: var(--font); font-size: 0.87rem;
      font-weight: 600; color: var(--text-dim); cursor: pointer; transition: all 0.18s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .dl-all-btn:hover { border-color: rgba(255,255,255,0.22); color: var(--text); background: rgba(255,255,255,0.03); }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 22px;
      font-family: var(--mono); font-size: 0.76rem; color: var(--text-faint);
      text-decoration: none; transition: color 0.18s; animation: fadeUp 0.5s 0.3s ease both;
    }
    .back-link:hover { color: var(--cobalt); }

    .btn-primary {
      display: inline-block; background: var(--cobalt);
      border: none; border-radius: 10px; padding: 12px 26px;
      font-family: var(--font); font-size: 0.88rem; font-weight: 700;
      color: #fff; cursor: pointer; text-decoration: none; transition: all 0.18s;
    }
    .btn-primary:hover { background: #3d59f5; transform: translateY(-1px); }

    .page-footer { border-top: 1px solid var(--line-soft); padding: 22px 0; text-align: center; font-family: var(--mono); font-size: 0.7rem; color: var(--text-faint); margin-top: 24px; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 3px; }

    @media (max-width: 560px) {
      .topnav { padding: 12px 16px; }
      .fc-icon { width: 38px; height: 38px; font-size: 17px; border-radius: 9px; }
      .dl-btn  { padding: 9px 15px; font-size: 0.77rem; }
      .code-header { flex-direction: column; }
      .expiry { width: auto; flex-direction: row; border-left: none; border-top: 1.5px dashed rgba(255,255,255,0.16); padding: 10px; }
    }
  </style>
</head>
<body>

<canvas id="starfield"></canvas>
<div class="aurora"><div class="ab ab1"></div><div class="ab ab2"></div></div>
<div class="grid-bg"></div>

<nav class="topnav">
  <a href="/" class="brand">
    <div class="brand-icon">LS</div>
    <span class="brand-name">Localshare</span>
  </a>
  <a href="/" class="btn-share">Send files</a>
</nav>

<div class="wrap">

  <!-- Trust banner — always shown -->
  <div class="ty-banner">
    <div class="ty-icon">✅</div>
    <div class="ty-head">Fetching this securely</div>
    <div class="ty-sub">We don't log who accesses a link or inspect what's inside it.</div>
    <div class="ty-pills">
      <span class="ty-pill">Zero logging</span>
      <span class="ty-pill">No account needed</span>
      <span class="ty-pill">Temporary storage only</span>
    </div>
  </div>

  <div id="mainContent">
    <div class="state">
      <div class="spinner"></div>
      <p>Fetching your files…</p>
    </div>
  </div>

  <div class="page-footer">Localshare — Fast. Temporary. No account needed.</div>
</div>

<script>
/* STARFIELD — subtle, static-feeling */
(function(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  function init(){
    stars = [];
    const n = Math.floor(canvas.width * canvas.height / 5500);
    for(let i = 0; i < n; i++) stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.1+0.2, a: Math.random()*0.5+0.1, tw: Math.random()*Math.PI*2, sp: Math.random()*0.2+0.04 });
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars.forEach(s=>{ s.tw+=s.sp*0.04; const a=s.a*(0.55+0.45*Math.sin(s.tw)); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fillStyle=`rgba(220,224,235,${a})`; ctx.fill(); });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',()=>{ resize(); init(); });
  resize(); init(); draw();
})();
</script>

<script>
  const code = window.location.pathname.split('/access/')[1];
  const mainContent = document.getElementById('mainContent');

  function getFileIcon(name) {
    const ext = (name || '').split('.').pop().toLowerCase();
    const map = { pdf:'📄', jpg:'🖼️', jpeg:'🖼️', png:'🖼️', gif:'🖼️', webp:'🖼️', mp4:'🎬', mov:'🎬', avi:'🎬', mp3:'🎵', wav:'🎵', zip:'🗜️', rar:'🗜️', '7z':'🗜️', doc:'📝', docx:'📝', xls:'📊', xlsx:'📊', ppt:'📑', pptx:'📑', txt:'📃', js:'💻', ts:'💻', html:'🌐', css:'🎨', py:'🐍' };
    return map[ext] || '📁';
  }

  function formatBytes(b) {
    if (!b) return '';
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    return (b/1048576).toFixed(1) + ' MB';
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }

  function forceDownload(url, filename, btn) {
    if (btn) { btn.classList.add('downloading'); btn.textContent = 'Downloading…'; }
    // Our /download/ route validates the session then 302-redirects to Cloudinary
    // with fl_attachment — so the browser gets a proper Save-As dialog directly
    // from Cloudinary's CDN without proxying through our server.
    const a = document.createElement('a');
    a.href = url;
    a.setAttribute('download', filename);
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    if (btn) { setTimeout(() => { btn.classList.remove('downloading'); btn.innerHTML = 'Download'; }, 2500); }
  }

  async function loadFiles() {
    if (!code) { showError('No code found', 'This link appears to be invalid.'); return; }
    try {
      const res  = await fetch('/api/access/' + code);
      const data = await res.json();
      if (data.error) { data.error.includes('expired') ? showExpired() : showError('Invalid code', data.error); return; }
      showFiles(data.files);
    } catch (err) {
      showError('Connection error', 'Could not reach the server. Please try again.');
    }
  }

  function showFiles(files) {
    mainContent.innerHTML = `
      <div class="code-header">
        <div class="code-meta">
          <h3>Claim code</h3>
          <div class="code-val">${escapeHtml(code)}</div>
        </div>
        <div class="expiry">
          <span>Status</span>
          <span>● Active</span>
        </div>
      </div>

      <div class="file-count">${files.length} file${files.length !== 1 ? 's' : ''} ready to download</div>

      <div class="files-grid" id="filesGrid">
        ${files.map((file, idx) => `
          <div class="file-card">
            <div class="fc-icon">${getFileIcon(file.name)}</div>
            <div class="fc-info">
              <div class="fc-name">${escapeHtml(file.name)}</div>
              <div class="fc-meta">${formatBytes(file.size)}</div>
            </div>
            <button class="dl-btn" data-url="${escapeHtml(file.url)}" data-name="${escapeHtml(file.name)}" data-idx="${idx}">
              Download
            </button>
          </div>
        `).join('')}
      </div>

      ${files.length > 1 ? `
      <div class="dl-all-wrap">
        <button class="dl-all-btn" id="dlAllBtn">Download all files</button>
      </div>` : ''}

      <a href="/" class="back-link">← Send your own files</a>
    `;

    document.querySelectorAll('.dl-btn').forEach(btn => {
      btn.addEventListener('click', () => forceDownload(btn.dataset.url, btn.dataset.name, btn));
    });

    const dlAllBtn = document.getElementById('dlAllBtn');
    if (dlAllBtn) {
      dlAllBtn.addEventListener('click', () => {
        dlAllBtn.disabled = true;
        dlAllBtn.textContent = 'Starting downloads…';
        files.forEach((file, i) => {
          setTimeout(() => {
            forceDownload(file.url, file.name, null);
            if (i === files.length - 1) {
              setTimeout(() => { dlAllBtn.disabled = false; dlAllBtn.textContent = 'Download all files'; }, 1500);
            }
          }, i * 800);
        });
      });
    }
  }

  function showExpired() {
    mainContent.innerHTML = `
      <div class="state">
        <div class="state-icon">⏰</div>
        <h2>Link expired</h2>
        <p>This share link has expired and the files have been deleted.</p>
        <a href="/" class="btn-primary">Send new files</a>
      </div>`;
  }

  function showError(title, message) {
    mainContent.innerHTML = `
      <div class="state">
        <div class="state-icon">🔍</div>
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(message)}</p>
        <a href="/" class="btn-primary">Go back home</a>
      </div>`;
  }

  loadFiles();
</script>
</body>
</html>
